<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUpStore | Pro Gaming Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #06080f;
            --bg-card: #10141f;
            --accent-cyan: #00f2fe;
            --accent-purple: #7000ff;
            --text-main: #ffffff;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }

        /* SKELETON LOADER ANIMATION */
        @keyframes shimmer {
            0% { background-position: -468px 0; }
            100% { background-position: 468px 0; }
        }
        .skeleton {
            background: #1a2233;
            background-image: linear-gradient(to right, #1a2233 0%, #2d3b54 20%, #1a2233 40%, #1a2233 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            animation: shimmer 1.5s infinite linear;
            border-radius: 15px;
        }

        header {
            padding: 15px 40px;
            background: rgba(7, 9, 14, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo img { height: 45px; filter: drop-shadow(0 0 8px var(--accent-cyan)); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* SECCIONES ESPECIALES (OFERTAS / MÁS VENDIDOS) */
        .special-section { margin-bottom: 50px; }
        .section-title { font-family: var(--font-title); color: var(--accent-cyan); margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        .horizontal-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        /* CATEGORÍAS */
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .category-card {
            height: 150px; border-radius: 20px; position: relative; overflow: hidden; cursor: pointer;
            border: 1px solid #1e293b; transition: 0.3s;
        }
        .category-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.5s; }
        .category-card:hover img { opacity: 1; transform: scale(1.1); }
        .category-card h2 {
            position: absolute; bottom: 15px; left: 15px; font-family: var(--font-title);
            font-size: 14px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* PRODUCTOS */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: var(--bg-card); border: 1px solid #1e293b; border-radius: 16px; padding: 20px; }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed; top: 100px; right: 20px; background: var(--accent-cyan); color: #000;
            padding: 12px 25px; border-radius: 10px; font-weight: bold; transform: translateX(200%);
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 2000;
        }
        .toast.active { transform: translateX(0); }

        /* CARRITO WIDGET */
        .cart-widget { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        .cart-button {
            width: 65px; height: 65px; background: var(--accent-cyan); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
        }
        .cart-popup {
            position: absolute; bottom: 80px; right: 0; width: 320px; background: #0d121c;
            border: 1px solid var(--accent-cyan); border-radius: 20px; padding: 20px;
            display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .cart-popup.active { display: block; }
    </style>
</head>
<body>

    <div class="toast" id="toast">¡Añadido al carrito! 🚀</div>

    <header>
        <div class="logo" onclick="renderHome()" style="cursor:pointer">
            <img src="https://lh3.googleusercontent.com/d/10RGPumDCs7oHt7O5Vn-kk7o193iKuhjs" alt="Logo">
        </div>
    </header>

    <div class="container" id="app">
        <!-- Skeleton Loader inicial -->
        <div class="special-section">
            <div class="skeleton" style="width: 200px; height: 30px; mb: 20px;"></div>
            <div class="horizontal-scroll">
                <div class="skeleton" style="min-width: 200px; height: 120px;"></div>
                <div class="skeleton" style="min-width: 200px; height: 120px;"></div>
                <div class="skeleton" style="min-width: 200px; height: 120px;"></div>
            </div>
        </div>
    </div>

    <div class="cart-widget">
        <div class="cart-popup" id="cartPopup">
            <div id="cartItems"></div>
            <hr style="border: 0.5px solid #1e293b; margin: 15px 0;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px;">
                <span>TOTAL:</span><span id="cartTotal">$0.00</span>
            </div>
            <button onclick="sendOrder()" style="width:100%; padding:12px; background:var(--accent-cyan); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">ENVIAR PEDIDO</button>
        </div>
        <div class="cart-button" onclick="document.getElementById('cartPopup').classList.toggle('active')">
            <i class="fa-solid fa-shopping-cart" style="color:black; font-size:20px;"></i>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const WHATSAPP_NUMBER = "593900000000";
        const APPS_SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT_AQUI"; // Importante para el registro
        const PRODS_URL = "https://docs.google.com/spreadsheets/d/1FcKvXhbHrASVvqBFU_EYtpiMtlMo4QnfV33aeRM-rRM/gviz/tq?tqx=out:csv";
        const CATS_URL = "https://docs.google.com/spreadsheets/d/1u2Ut3bovjOh7BWljQ-ZTaWp5KM7upkzsvxZqeydZIMA/gviz/tq?tqx=out:csv";

        let db_products = [];
        let db_categories = {};
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        async function init() {
            try {
                // Carga optimizada (paralela)
                const [resProds, resCats] = await Promise.all([fetch(PRODS_URL), fetch(CATS_URL)]);
                
                // Procesar Categorías
                const catsText = await resCats.text();
                catsText.split('\n').slice(1).forEach(row => {
                    const [name, img] = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if(name) db_categories[name] = img;
                });

                // Procesar Productos
                const prodsText = await resProds.text();
                db_products = prodsText.split('\n').slice(1).map((row, i) => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    return { id: i, cat: c[0], sub: c[1], name: c[2], price: parseFloat(c[3].replace(',','.')) };
                }).filter(p => p.cat);

                renderHome();
                updateCart();
            } catch (e) { console.error("Error al iniciar", e); }
        }

        function renderHome() {
            const app = document.getElementById('app');
            const offers = db_products.filter(p => p.cat.toUpperCase() === 'OFERTAS');
            const bestSellers = db_products.filter(p => p.cat.toUpperCase() === 'MAS VENDIDOS');
            const mainCats = [...new Set(db_products.map(p => p.cat))].filter(c => !['OFERTAS', 'MAS VENDIDOS'].includes(c.toUpperCase()));

            let html = '';

            // 1. Sección Ofertas (Dinámica)
            if(offers.length > 0) {
                html += `<div class="special-section"><h2 class="section-title"><i class="fa-solid fa-fire"></i> OFERTAS RELÁMPAGO</h2><div class="horizontal-scroll">`;
                offers.forEach(p => html += renderMiniCard(p));
                html += `</div></div>`;
            }

            // 2. Sección Más Vendidos
            if(bestSellers.length > 0) {
                html += `<div class="special-section"><h2 class="section-title"><i class="fa-solid fa-star"></i> LO MÁS VENDIDO</h2><div class="horizontal-scroll">`;
                bestSellers.forEach(p => html += renderMiniCard(p));
                html += `</div></div>`;
            }

            // 3. Cuadrícula de Categorías
            html += `<h2 class="section-title">CATEGORÍAS</h2><div class="category-grid">`;
            mainCats.forEach(cat => {
                const img = db_categories[cat] || 'https://via.placeholder.com/300x150?text=LevelUp';
                html += `
                    <div class="category-card" onclick="renderCategory('${cat}')">
                        <img src="${img}" loading="lazy">
                        <h2>${cat}</h2>
                    </div>`;
            });
            html += `</div>`;

            app.innerHTML = html;
        }

        function renderMiniCard(p) {
            return `
                <div class="product-card" style="min-width: 220px; flex-shrink: 0; border-color: var(--accent-cyan);">
                    <div style="font-size:12px; color: var(--accent-cyan); font-weight: bold;">${p.sub}</div>
                    <div style="font-size:14px; margin: 10px 0; height: 35px; overflow: hidden;">${p.name}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:18px; font-weight:bold;">$${p.price.toFixed(2)}</span>
                        <button onclick="addToCart(${p.id})" style="background:var(--accent-cyan); border:none; padding:5px 10px; border-radius:5px; cursor:pointer;"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>`;
        }

        function renderCategory(catName) {
            const filtered = db_products.filter(p => p.cat === catName);
            let html = `<div style="margin-bottom:20px; display:flex; gap:15px; align-items:center;">
                <button onclick="renderHome()" style="background:#1a2233; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="section-title" style="margin:0">${catName}</h2>
            </div><div class="products-grid">`;
            filtered.forEach(p => html += renderMiniCard(p));
            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        // CARRITO Y LOGS
        function addToCart(id) {
            const p = db_products.find(prod => prod.id === id);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty++; else cart.push({...p, qty: 1});
            
            // Toast inmediato
            const t = document.getElementById('toast');
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 2000);
            
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            const list = document.getElementById('cartItems');
            let total = 0;
            list.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:14px;">
                    <span>${i.qty}x ${i.name}</span><span>$${(i.price*i.qty).toFixed(2)}</span>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
        }

        async function sendOrder() {
            if(cart.length === 0) return;
            
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0).toFixed(2);
            const pedidoString = cart.map(i => `${i.qty}x ${i.name}`).join(', ');
            const fecha = new Date().toLocaleString();

            // REGISTRO SILENCIOSO EN GOOGLE SHEETS
            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ fecha, pedido: pedidoString, total })
                });
            } catch(e) {}

            // WHATSAPP
            let msg = `🚀 *NUEVO PEDIDO - LevelUpStore*\n\n📅 Fecha: ${fecha}\n\n`;
            cart.forEach(i => msg += `• ${i.qty}x ${i.name} ($${(i.price*i.qty).toFixed(2)})\n`);
            msg += `\n💰 *TOTAL: $${total} USD*`;
            
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        init();
    </script>
</body>
</html>
