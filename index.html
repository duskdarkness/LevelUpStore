<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUpStore | Pro Gaming Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #06080f;
            --bg-card: #10141f;
            --accent-cyan: #00f2fe;
            --accent-purple: #7000ff;
            --text-main: #ffffff;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }

        /* SKELETON LOADER ANIMATION */
        @keyframes shimmer {
            0% { background-position: -468px 0; }
            100% { background-position: 468px 0; }
        }
        .skeleton {
            background: #1a2233;
            background-image: linear-gradient(to right, #1a2233 0%, #2d3b54 20%, #1a2233 40%, #1a2233 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            animation: shimmer 1.5s infinite linear;
            border-radius: 15px;
        }

        header {
            padding: 15px 40px;
            background: rgba(7, 9, 14, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo img { height: 45px; filter: drop-shadow(0 0 8px var(--accent-cyan)); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        .special-section { margin-bottom: 50px; }
        .section-title { font-family: var(--font-title); color: var(--accent-cyan); margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }

        .horizontal-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .category-card {
            height: 150px; border-radius: 20px; position: relative; overflow: hidden; cursor: pointer;
            border: 1px solid #1e293b; transition: 0.3s; background: #1a2233;
        }
        .category-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.5s; }
        .category-card:hover img { opacity: 1; transform: scale(1.1); }
        .category-card h2 {
            position: absolute; bottom: 15px; left: 15px; font-family: var(--font-title);
            font-size: 14px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); z-index: 2;
        }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: var(--bg-card); border: 1px solid #1e293b; border-radius: 16px; padding: 20px; }

        .toast {
            position: fixed; top: 100px; right: 20px; background: var(--accent-cyan); color: #000;
            padding: 12px 25px; border-radius: 10px; font-weight: bold; transform: translateX(200%);
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 2000;
        }
        .toast.active { transform: translateX(0); }

        .cart-widget { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        .cart-button {
            width: 65px; height: 65px; background: var(--accent-cyan); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4); position: relative;
        }
        .cart-badge {
            position: absolute; top: 0; right: 0; background: #ff3e3e; color: white;
            width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
        }
        .cart-popup {
            position: absolute; bottom: 80px; right: 0; width: 350px; background: #0d121c;
            border: 1px solid var(--accent-cyan); border-radius: 20px; padding: 20px;
            display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .cart-popup.active { display: block; }
        
        .cart-items-list { 
            max-height: 300px; 
            overflow-y: auto; 
            margin: 15px 0; 
            padding-right: 12px; /* Espacio para que el scroll no toque los botones */
        }

        /* Barra de desplazamiento fina y elegante */
        .cart-items-list::-webkit-scrollbar { width: 5px; }
        .cart-items-list::-webkit-scrollbar-track { background: #0d121c; }
        .cart-items-list::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

        /* Estilo del Aviso de Confirmación Personalizado */
        .confirm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .confirm-box {
            background: var(--bg-card); border: 1px solid var(--accent-cyan);
            padding: 30px; border-radius: 25px; text-align: center;
            max-width: 320px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }
        .confirm-box p { font-family: var(--font-title); font-size: 14px; margin-bottom: 25px; color: #fff; }
        .confirm-btns { display: flex; gap: 12px; }
        .btn-confirm { flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-family: var(--font-body); }
    </style>
</head>
<body>

    <div class="toast" id="toast">¡Añadido al carrito! 🚀</div>

    <header>
        <div class="logo" onclick="renderHome()" style="cursor:pointer">
            <img src="https://lh3.googleusercontent.com/d/10RGPumDCs7oHt7O5Vn-kk7o193iKuhjs" alt="Logo">
        </div>
    </header>

    <div class="container" id="app">
        <div class="special-section">
            <div class="skeleton" style="width: 200px; height: 30px; margin-bottom: 20px;"></div>
            <div class="horizontal-scroll">
                <div class="skeleton" style="min-width: 220px; height: 120px;"></div>
                <div class="skeleton" style="min-width: 220px; height: 120px;"></div>
                <div class="skeleton" style="min-width: 220px; height: 120px;"></div>
            </div>
        </div>
    </div>

    <div class="cart-widget">
        <div class="cart-popup" id="cartPopup">
            <h3 style="font-family: var(--font-title); font-size: 14px; color: var(--accent-cyan);">TU CARRITO</h3>
            <div id="cartItems" class="cart-items-list"></div>
            <hr style="border: 0.5px solid #1e293b; margin: 15px 0;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px;">
                <span>TOTAL:</span><span id="cartTotal" style="color: var(--accent-cyan)">$0.00</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="clearCart()" style="background:#1a2233; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; padding:10px;">VACIAR</button>
                <button onclick="sendOrder()" style="padding:12px; background:var(--accent-cyan); color:black; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">PEDIR <i class="fa-brands fa-whatsapp"></i></button>
            </div>
        </div>
        <div class="cart-button" onclick="document.getElementById('cartPopup').classList.toggle('active')">
            <i class="fa-solid fa-shopping-cart" style="color:black; font-size:20px;"></i>
            <div class="cart-badge" id="cartBadge">0</div>
        </div>
    </div>
    
<!-- Modal de Confirmación Personalizado -->
    <div id="customConfirm" class="confirm-overlay">
        <div class="confirm-box">
            <p>¿ESTÁS SEGURO QUE DESEAS VACIAR EL CARRITO?</p>
            <div class="confirm-btns">
                <button onclick="actuallyClearCart()" class="btn-confirm" style="background: var(--accent-cyan); color: #000;">SÍ, VACIAR</button>
                <button onclick="closeConfirm()" class="btn-confirm" style="background: #1a2233; color: #fff;">CANCELAR</button>
            </div>
        </div>
    </div>
    
    <script>
        const WHATSAPP_NUMBER = "593900000000";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx85fE0vWUXR7yD_x-9loITu_hDyCvVmfgE6SqxeWyly2wjv2ie7R2DhKPdHXVviwgDyg/exec";
        const PRODS_URL = "https://docs.google.com/spreadsheets/d/1FcKvXhbHrASVvqBFU_EYtpiMtlMo4QnfV33aeRM-rRM/gviz/tq?tqx=out:csv";
        const CATS_URL = "https://docs.google.com/spreadsheets/d/1u2Ut3bovjOh7BWljQ-ZTaWp5KM7upkzsvxZqeydZIMA/gviz/tq?tqx=out:csv";

        let db_products = [];
        let db_categories = {};
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // --- FUNCIÓN DE IMÁGENES MEJORADA (DRIVE + IMGUR) ---
        function getDirectImgLink(url) {
            if (!url || url.trim() === "") return 'https://via.placeholder.com/400x250?text=LevelUp+Store';
            url = url.trim();

            // CASO 1: GOOGLE DRIVE
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)|id=([a-zA-Z0-9_-]+)/);
                const id = match ? (match[1] || match[2]) : null;
                if (id) return `https://lh3.googleusercontent.com/d/${id}`;
            }

            // CASO 2: IMGUR (Convierte enlace de página a imagen directa)
            if (url.includes('imgur.com') && !url.includes('i.imgur.com')) {
                // Extrae el código después de la última barra
                const parts = url.split('/');
                const id = parts[parts.length - 1];
                return `https://i.imgur.com/${id}.jpg`; // Forzamos jpg, Imgur suele resolverlo bien
            }

            return url;
        }

        function cleanPrice(priceString) {
            if (!priceString) return 0;
            const cleaned = priceString.toString().replace(/\s/g, '').replace(/[^0-9,.]/g, '').replace(',', '.');
            return parseFloat(cleaned) || 0;
        }

        async function init() {
            try {
                const [resProds, resCats] = await Promise.all([
                    fetch(PRODS_URL).then(r => r.text()),
                    fetch(CATS_URL).then(r => r.text())
                ]);
                
                // Procesar Categorías con Normalización Estricta
                resCats.split(/\r?\n/).forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if(cols[0]) {
                        // Limpieza de espacios dobles y normalización
                        const catKey = cols[0].toLowerCase().trim().replace(/\s+/g, ' ');
                        db_categories[catKey] = getDirectImgLink(cols[1]);
                    }
                });

                const prodsText = resProds;
                db_products = prodsText.split(/\r?\n/).slice(1).map((row, i) => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if(c.length >= 4) {
                        return { id: i, cat: c[0], sub: c[1], name: c[2], price: cleanPrice(c[3]) };
                    }
                    return null;
                }).filter(p => p && p.cat);

                renderHome();
                updateCart();
            } catch (e) { console.error("Error al iniciar", e); }
        }

        function renderHome() {
            const app = document.getElementById('app');
            const offers = db_products.filter(p => p.cat.toLowerCase().trim() === 'ofertas');
            const bestSellers = db_products.filter(p => p.cat.toLowerCase().trim() === 'mas vendidos');
            const mainCats = [...new Set(db_products.map(p => p.cat))].filter(c => {
                const normalized = c.toLowerCase().trim();
                return normalized !== 'ofertas' && normalized !== 'mas vendidos';
            });

            let html = '';

            if(offers.length > 0) {
                html += `<div class="special-section"><h2 class="section-title"><i class="fa-solid fa-fire"></i> OFERTAS RELÁMPAGO</h2><div class="horizontal-scroll">${offers.map(p => renderMiniCard(p)).join('')}</div></div>`;
            }

            if(bestSellers.length > 0) {
                html += `<div class="special-section"><h2 class="section-title"><i class="fa-solid fa-star"></i> LO MÁS VENDIDO</h2><div class="horizontal-scroll">${bestSellers.map(p => renderMiniCard(p)).join('')}</div></div>`;
            }

            html += `<h2 class="section-title">CATEGORÍAS</h2><div class="category-grid">`;
            mainCats.forEach(cat => {
                const catKey = cat.toLowerCase().trim().replace(/\s+/g, ' ');
                const img = db_categories[catKey] || `https://via.placeholder.com/400x250?text=${cat}`;
                
                html += `
                    <div class="category-card" onclick="renderCategory('${cat}')">
                        <img src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x250?text=${cat}'">
                        <h2>${cat}</h2>
                    </div>`;
            });
            html += `</div>`;
            app.innerHTML = html;
        }

        function renderCategory(catName) {
            const filtered = db_products.filter(p => p.cat === catName);
            let html = `
                <div style="margin-bottom:20px; display:flex; gap:15px; align-items:center;">
                    <button onclick="renderHome()" style="background:#1a2233; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> VOLVER</button>
                    <h2 class="section-title" style="margin:0">${catName}</h2>
                </div>
                <div class="products-grid">${filtered.map(p => renderMiniCard(p)).join('')}</div>`;
            document.getElementById('app').innerHTML = html;
            window.scrollTo(0,0);
        }

        function renderMiniCard(p) {
            return `
                <div class="product-card" style="min-width: 240px; border: 1px solid #1e293b;">
                    <div style="font-size:11px; color: var(--accent-cyan); font-weight: bold; text-transform: uppercase;">${p.sub}</div>
                    <div style="font-size:14px; margin: 10px 0; height: 35px; overflow: hidden; font-weight: bold;">${p.name}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:18px; font-weight:bold; color: white;">$${p.price.toFixed(2)}</span>
                        <button onclick="addToCart(${p.id})" style="background:var(--accent-cyan); color: black; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;">+ ADD</button>
                    </div>
                </div>`;
        }

        function addToCart(id) {
            const p = db_products.find(prod => prod.id === id);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty++; else cart.push({...p, qty: 1});
            
            const t = document.getElementById('toast');
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 2000);
            updateCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) removeItem(id);
                else updateCart();
            }
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateCart();
        }

        // Abre el aviso personalizado
        function clearCart() {
            if(cart.length > 0) {
                document.getElementById('customConfirm').style.display = 'flex';
            }
        }

        // Ejecuta el vaciado real
        function actuallyClearCart() {
            cart = [];
            updateCart();
            closeConfirm();
        }

        // Cierra el aviso sin hacer nada
        function closeConfirm() {
            document.getElementById('customConfirm').style.display = 'none';
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            const list = document.getElementById('cartItems');
            let total = 0;
            let count = 0;

            if(cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:gray; padding:20px;">Vacío</p>`;
            } else {
                list.innerHTML = cart.map(i => {
                    const subtotal = i.price * i.qty;
                    total += subtotal;
                    count += i.qty;
                    return `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #1e293b; padding-bottom:8px;">
                            <div style="flex:1; padding-right:10px;">
                                <div style="font-size:13px; font-weight:bold; color:white; line-height:1.2;">${i.name}</div>
                                <div style="font-size:11px; color:var(--accent-cyan);">$${subtotal.toFixed(2)}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <button onclick="changeQty(${i.id}, -1)" style="width:24px; height:24px; background:#1a2233; color:white; border:1px solid #2d3b54; border-radius:5px; cursor:pointer;">-</button>
                                <span style="font-weight:bold; min-width:15px; text-align:center;">${i.qty}</span>
                                <button onclick="changeQty(${i.id}, 1)" style="width:24px; height:24px; background:#1a2233; color:white; border:1px solid #2d3b54; border-radius:5px; cursor:pointer;">+</button>
                                <button onclick="removeItem(${i.id})" style="background:transparent; border:none; color:#ff4b4b; cursor:pointer; margin-left:12px; padding: 5px; font-size: 18px;"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>`;
                }).join('');
            }
            document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cartBadge').innerText = count;
        }

        async function sendOrder() {
            if(cart.length === 0) return;
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0).toFixed(2);
            const pedidoString = cart.map(i => `${i.qty}x ${i.name}`).join(', ');
            const fecha = new Date().toLocaleString();

            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ fecha, pedido: pedidoString, total })
                });
            } catch(e) {}

            let msg = `🚀 *PEDIDO - LevelUpStore*\n\n📅 Fecha: ${fecha}\n\n`;
            cart.forEach(i => msg += `• ${i.qty}x ${i.name} ($${(i.price*i.qty).toFixed(2)})\n`);
            msg += `\n💰 *TOTAL: $${total} USD*`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        init();
    </script>
</body>
</html>
