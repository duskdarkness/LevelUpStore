<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUpStore</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        /* Make sidebar sticky and keep it visible while scrolling */
        #sidebar {
            position: sticky;
            top: 100px;
            align-self: start;
            height: fit-content;
            transition: all 0.3s ease;
        }
        /* Toggle button sits on the sidebar edge */
        .sidebar-toggle-btn {
            position: absolute;
            top: 20px;
            right: -18px;
            z-index: 9999;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-collapsed {
            width: 92px;
            min-width: 92px;
            padding: 1.25rem 0.75rem !important;
        }
        .sidebar-collapsed .sidebar-header h2,
        .sidebar-collapsed .sidebar-body {
            display: none;
        }
        .sidebar-collapsed .sidebar-toggle-btn {
            right: 20px;
        }
        @media (max-width: 1024px) {
            #sidebar {
                position: relative;
                top: 0;
            }
            .sidebar-toggle-btn {
                right: 16px;
                top: 16px;
            }
        }
        .category-pill {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .category-pill.active {
            background: var(--primary, #06b6d4);
            color: black;
            font-weight: bold;
            box-shadow: 0 0 15px var(--primary, #06b6d4);
            border-color: var(--primary, #06b6d4);
        }
        .sidebar-scroll {
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }
        .cart-window-scroll {
            max-height: 52vh;
            overflow-y: auto;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary, #06b6d4); }
    </style>
</head>
<body class="min-h-screen pb-24 overflow-x-hidden bg-slate-950 text-slate-100">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass px-6 py-4 mb-6 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center shadow-lg">
                    <i class="fas fa-rocket text-black text-xl"></i>
                </div>
                <h1 class="header-font text-2xl font-bold tracking-tighter text-white uppercase">LEVELUP<span class="text-cyan-400">STORE</span></h1>
            </div>
        </div>
    </nav>

    <main class="min-h-screen max-w-7xl mx-auto px-4 grid lg:grid-cols-[280px_minmax(0,1fr)] gap-6">
        <aside id="sidebar" class="relative glass rounded-3xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
            <div class="sidebar-header mb-6">
                <h2 class="text-xl font-bold text-white mb-0">Buscar</h2>
            </div>
            <button id="toggleSidebarBtn" class="sidebar-toggle-btn rounded-full bg-slate-800 p-3 text-slate-200 hover:bg-slate-700 transition shadow-lg">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div id="sidebarBody" class="sidebar-body">
                <div class="mb-6">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Buscar juego o tarjeta..."
                            class="w-full bg-slate-900/80 border border-slate-700 rounded-full py-3 pl-12 pr-4 focus:outline-none focus:border-cyan-400 transition-all text-base text-white">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                <div class="mb-6">
                    <h3 class="text-sm uppercase tracking-[0.3em] text-slate-400 mb-4">Categorías</h3>
                    <div id="filterContainer" class="flex flex-col gap-2 sidebar-scroll pr-2">
                        <button class="category-pill active px-4 py-3 rounded-2xl text-[11px] uppercase tracking-wider text-slate-200 text-left" data-cat="all">Todos</button>
                    </div>
                </div>
            </div>
        </aside>

        <section class="px-2 lg:px-0">
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- Cargado por JS -->
            </div>

            <div id="emptyState" class="hidden text-center py-20">
                <i class="fas fa-search text-6xl text-slate-700 mb-4"></i>
                <p class="text-slate-400 text-xl">No encontramos productos en esta categoría.</p>
            </div>
        </section>
    </main>

    <!-- Botón Flotante Carrito -->
    <button id="cartWidgetBtn" class="fixed right-5 bottom-5 z-[9999] flex items-center gap-3 rounded-full bg-cyan-500 px-5 py-3 text-sm font-semibold text-black shadow-2xl hover:bg-cyan-400 transition">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartWidgetSummary">0 ítems | Total: $0.00</span>
    </button>

    <!-- Modal Carrito -->
    <div id="cartWindow" class="fixed inset-0 z-[9988] hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
        <div class="relative w-full max-w-xl rounded-[30px] border border-slate-700 bg-slate-950/95 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-700 px-5 py-4">
                <div>
                    <h2 class="text-lg font-bold text-white">Tu carrito</h2>
                    <p id="cartWindowSummary" class="text-slate-400 text-xs">Revisa tus productos aquí.</p>
                </div>
                <button id="closeCartBtn" class="rounded-full bg-slate-800 p-2 text-slate-200 hover:bg-slate-700 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="cartItems" class="cart-window-scroll space-y-3 p-4"></div>
            <div class="border-t border-slate-700 p-4">
                <div class="flex items-center justify-between text-sm text-slate-400 mb-3">
                    <span>Total</span>
                    <span id="cartTotal" class="text-white font-bold">$0.00</span>
                </div>
                <div class="flex gap-2">
                    <button id="clearCartBtnWindow" class="flex-1 rounded-full bg-slate-800 hover:bg-red-600 transition px-4 py-2 text-sm font-semibold text-white">Vaciar</button>
                    <a id="checkoutBtn" href="#" target="_blank" class="flex-1 rounded-full bg-cyan-500 hover:bg-cyan-400 transition px-4 py-2 text-sm font-semibold text-black text-center">Enviar</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
