<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUpStore | Gaming Shop</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #06080f;
            --bg-card: #10141f;
            --accent-cyan: #00f2fe;
            --accent-purple: #7000ff;
            --text-main: #ffffff;
            --text-muted: #8c9ba5;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        /* HEADER */
        header {
            padding: 15px 40px;
            background: rgba(7, 9, 14, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo img { height: 45px; filter: drop-shadow(0 0 8px var(--accent-cyan)); }

        .search-box { position: relative; width: 250px; }
        .search-box input {
            width: 100%; padding: 8px 12px 8px 35px;
            background: #121826; border: 1px solid #232d3f;
            border-radius: 12px; color: #fff; outline: none;
        }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* CONTENEDOR PRINCIPAL */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* VISTA DE CATEGORÍAS (MENU PRINCIPAL) */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .category-card {
            background: linear-gradient(145deg, #10141f, #161d2e);
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .category-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
        }
        .category-card i { font-size: 40px; color: var(--accent-cyan); margin-bottom: 15px; }
        .category-card h2 { font-family: var(--font-title); font-size: 18px; text-transform: uppercase; }

        /* VISTA DE PRODUCTOS */
        .view-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .btn-back {
            background: #1a2233; color: #fff; border: 1px solid #2d3b54;
            padding: 10px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .btn-back:hover { background: var(--accent-cyan); color: #000; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--bg-card); border: 1px solid #1e293b;
            border-radius: 16px; padding: 20px; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--accent-cyan); transform: scale(1.02); }
        .price-tag { color: var(--accent-cyan); font-size: 22px; font-weight: 800; }

        /* CARRITO FLOTANTE (WIDGET) */
        .cart-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }
        .cart-button {
            width: 65px; height: 65px;
            background: var(--accent-cyan);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            position: relative; transition: 0.3s;
        }
        .cart-button:hover { transform: scale(1.1); }
        .cart-button i { font-size: 24px; color: #000; }
        .cart-badge {
            position: absolute; top: 0; right: 0;
            background: #ff3e3e; color: #fff;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 12px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
        }

        /* POPUP DEL CARRITO */
        .cart-popup {
            position: absolute; bottom: 80px; right: 0;
            width: 350px; background: #0d121c;
            border: 1px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px;
            display: none; flex-direction: column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .cart-popup.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .cart-items-list { max-height: 300px; overflow-y: auto; margin: 15px 0; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .btn-checkout {
            background: var(--accent-cyan); color: #000; border: none;
            padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        /* LOADING INDICATOR */
        #loader { text-align: center; padding: 100px; font-family: var(--font-title); color: var(--accent-cyan); }

        @media (max-width: 600px) {
            .cart-popup { width: 90vw; right: -10px; }
            header { padding: 15px 20px; }
            .search-box { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showHome()" style="cursor:pointer">
            <img src="https://lh3.googleusercontent.com/d/10RGPumDCs7oHt7O5Vn-kk7o193iKuhjs" alt="Logo">
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar..." oninput="handleSearch()">
        </div>
    </header>

    <div class="container" id="mainContainer">
        <div id="loader">CARGANDO RECURSOS...</div>
    </div>

    <!-- WIDGET CARRITO -->
    <div class="cart-widget">
        <div class="cart-popup" id="cartPopup">
            <h3 style="font-family: var(--font-title); font-size: 16px; color: var(--accent-cyan);">TU CARRITO</h3>
            <div class="cart-items-list" id="cartItemsList">
                <!-- Items dinámicos -->
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
                <span>TOTAL:</span>
                <span style="color:var(--accent-cyan)">$<span id="cartTotal">0.00</span></span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button onclick="clearCart()" style="background:#1a2233; color:#fff; border:none; border-radius:10px; cursor:pointer;">VACIAR</button>
                <button class="btn-checkout" onclick="sendWhatsApp()">PEDIR <i class="fa-brands fa-whatsapp"></i></button>
            </div>
        </div>
        <div class="cart-button" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <div class="cart-badge" id="cartBadge">0</div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "593900000000"; 
        const SPREADSHEET_ID = '1FcKvXhbHrASVvqBFU_EYtpiMtlMo4QnfV33aeRM-rRM';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;

        let products = [];
        let cart = JSON.parse(localStorage.getItem("levelup_cart")) || [];

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                products = rows.map((row, i) => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if(cols.length >= 4) {
                        return { id: i, category: cols[0], sub: cols[1], title: cols[2], price: parseFloat(cols[3].replace(',','.')) };
                    }
                    return null;
                }).filter(p => p);

                showHome();
                updateCartUI();
            } catch (e) {
                document.getElementById('loader').innerText = "Error cargando datos. Verifica el enlace.";
            }
        }

        // VISTA: INICIO (CATEGORÍAS)
        function showHome() {
            const container = document.getElementById('mainContainer');
            const categories = [...new Set(products.map(p => p.category))];
            
            let html = `<h1 style="font-family:var(--font-title); margin-bottom:30px; text-align:center;">CATEGORÍAS</h1>`;
            html += `<div class="category-grid">`;
            categories.forEach(cat => {
                html += `
                    <div class="category-card" onclick="showCategory('${cat}')">
                        <i class="fa-solid fa-gamepad"></i>
                        <h2>${cat}</h2>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // VISTA: PRODUCTOS DE UNA CATEGORÍA
        function showCategory(catName) {
            const container = document.getElementById('mainContainer');
            const filtered = products.filter(p => p.category === catName);

            let html = `
                <div class="view-header">
                    <button class="btn-back" onclick="showHome()"><i class="fa-solid fa-arrow-left"></i> VOLVER</button>
                    <h1 style="font-family:var(--font-title); font-size:20px;">${catName}</h1>
                </div>
                <div class="products-grid">
            `;

            filtered.forEach(p => {
                html += `
                    <div class="product-card">
                        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;">${p.sub}</div>
                        <div style="font-weight:bold; font-size:16px; margin-bottom:15px; height:40px; overflow:hidden;">${p.title}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="price-tag">$${p.price.toFixed(2)}</div>
                            <button onclick="addToCart(${p.id})" style="background:var(--accent-cyan); border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">+ ADD</button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // BUSCADOR
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if(query.length < 2) return;

            const container = document.getElementById('mainContainer');
            const filtered = products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));

            container.innerHTML = `
                <div class="view-header">
                    <button class="btn-back" onclick="showHome()">INICIO</button>
                    <h1>RESULTADOS: "${query}"</h1>
                </div>
                <div class="products-grid">
            `;
            // Renderizado similar a showCategory...
            const grid = container.querySelector('.products-grid');
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div style="font-size:11px; color:var(--text-muted)">${p.category}</div>
                        <div style="font-weight:bold; margin:10px 0;">${p.title}</div>
                        <div style="display:flex; justify-content:space-between;">
                            <span class="price-tag">$${p.price.toFixed(2)}</span>
                            <button onclick="addToCart(${p.id})" style="background:var(--accent-cyan); border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">+</button>
                        </div>
                    </div>
                `;
            });
        }

        // LOGICA CARRITO
        function toggleCart() {
            document.getElementById('cartPopup').classList.toggle('active');
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            const exist = cart.find(item => item.id === id);
            if(exist) exist.qty++;
            else cart.push({...p, qty: 1});
            saveCart();
        }

        function clearCart() { cart = []; saveCart(); }

        function saveCart() {
            localStorage.setItem("levelup_cart", JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const badge = document.getElementById('cartBadge');
            const totalDisplay = document.getElementById('cartTotal');
            
            list.innerHTML = cart.length === 0 ? '<p style="text-align:center; color:gray;">Vacío</p>' : '';
            let total = 0;
            let count = 0;

            cart.forEach((item, i) => {
                total += item.price * item.qty;
                count += item.qty;
                list.innerHTML += `
                    <div class="cart-item">
                        <span>${item.qty}x ${item.title.substring(0,20)}...</span>
                        <span>$${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                `;
            });

            badge.innerText = count;
            totalDisplay.innerText = total.toFixed(2);
        }

        function sendWhatsApp() {
            if(cart.length === 0) return;
            let msg = "🚀 *NUEVO PEDIDO EN LEVELUPSTORE*\n\n";
            cart.forEach(i => msg += `• ${i.qty}x ${i.title} - $${(i.price*i.qty).toFixed(2)}\n`);
            msg += `\n*TOTAL: $${cart.reduce((s,i)=>s+(i.price*i.qty),0).toFixed(2)} USD*`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        init();
    </script>
</body>
</html>
