<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUpStore - Tu Tienda Digital Gamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050505;
        }
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg); 
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #050505 80%);
            background-attachment: fixed;
        }
        .header-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .product-card {
            background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
            border: 1px solid #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
        }
        .price-tag {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .category-pill {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .category-pill.active {
            background: var(--primary);
            color: black;
            font-weight: bold;
            box-shadow: 0 0 15px var(--primary);
            border-color: var(--primary);
        }
        .sidebar-scroll {
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }
        .cart-window-scroll {
            max-height: 52vh;
            overflow-y: auto;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass px-6 py-4 mb-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center shadow-lg">
                    <i class="fas fa-rocket text-black text-xl"></i>
                </div>
                <h1 class="header-font text-2xl font-bold tracking-tighter text-white uppercase">LEVELUP<span class="text-cyan-400">STORE</span></h1>
            </div>
            <button id="openCartBtn" class="flex items-center gap-2 rounded-full bg-cyan-500 px-4 py-2 text-sm font-semibold text-black shadow-lg hover:bg-cyan-400 transition">
                <i class="fas fa-shopping-cart"></i>
                Ver carrito
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="grid lg:grid-cols-[280px_minmax(0,1fr)] gap-6">
            <aside class="glass rounded-3xl border border-slate-700 p-6 shadow-xl">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-white mb-3">Buscar</h2>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Buscar juego o tarjeta..."
                            class="w-full bg-slate-900/80 border border-slate-700 rounded-full py-3 pl-12 pr-4 focus:outline-none focus:border-cyan-400 transition-all text-base text-white">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                <div class="mb-6">
                    <h3 class="text-sm uppercase tracking-[0.3em] text-slate-400 mb-4">Categorías</h3>
                    <div id="filterContainer" class="flex flex-col gap-2 sidebar-scroll pr-2">
                        <button class="category-pill active px-4 py-3 rounded-2xl text-[11px] uppercase tracking-wider text-slate-200 text-left" data-cat="all">Todos</button>
                    </div>
                </div>
                <div class="glass rounded-3xl bg-slate-950/90 border border-slate-700 p-4 shadow-inner">
                    <p class="text-slate-400 text-sm mb-3">Resumen rápido</p>
                    <p id="cartSummary" class="text-white font-semibold">Aún no has agregado productos.</p>
                    <div class="mt-4 flex gap-2">
                        <button id="clearCartBtn" class="flex-1 rounded-full bg-slate-800 hover:bg-red-600 transition px-4 py-2 text-sm font-semibold text-white">Vaciar</button>
                        <button id="openCartBtnMobile" class="flex-1 rounded-full bg-cyan-500 hover:bg-cyan-400 transition px-4 py-2 text-sm font-semibold text-black">Carrito</button>
                    </div>
                </div>
            </aside>

            <section>
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                    <!-- Cargado por JS -->
                </div>

                <div id="emptyState" class="hidden text-center py-20">
                    <i class="fas fa-search text-6xl text-slate-700 mb-4"></i>
                    <p class="text-slate-400 text-xl">No encontramos productos en esta categoría.</p>
                </div>
            </section>
        </div>
    </main>

    <div id="cartWindow" class="fixed right-5 bottom-5 z-50 hidden w-[320px] rounded-[30px] border border-slate-700 bg-slate-950/95 shadow-2xl backdrop-blur-xl">
        <div class="flex items-center justify-between border-b border-slate-700 px-5 py-4">
            <div>
                <h2 class="text-lg font-bold text-white">Tu carrito</h2>
                <p id="cartWindowSummary" class="text-slate-400 text-xs">Revisa tus productos aquí.</p>
            </div>
            <button id="closeCartBtn" class="rounded-full bg-slate-800 p-2 text-slate-200 hover:bg-slate-700 transition">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="cartItems" class="cart-window-scroll space-y-3 p-4"></div>
        <div class="border-t border-slate-700 p-4">
            <div class="flex items-center justify-between text-sm text-slate-400 mb-3">
                <span>Total</span>
                <span id="cartTotal" class="text-white font-bold">$0.00</span>
            </div>
            <div class="flex gap-2">
                <button id="clearCartBtnWindow" class="flex-1 rounded-full bg-slate-800 hover:bg-red-600 transition px-4 py-2 text-sm font-semibold text-white">Vaciar</button>
                <a id="checkoutBtn" href="#" target="_blank" class="flex-1 rounded-full bg-cyan-500 hover:bg-cyan-400 transition px-4 py-2 text-sm font-semibold text-black text-center">Enviar</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

    <script src="app.js"></script>
</body>
</html>
